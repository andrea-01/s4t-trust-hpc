services:
  hardhat-node:
    build:
      context: ../chain
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    networks:
      - trust-hpc-net
    healthcheck:
      # Node.js fetch API is available in node >= 18 to do a quick HTTP check
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  contract-deployer:
    build:
      context: ../chain
      dockerfile: Dockerfile
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "docker"]
    volumes:
      - ../chain/deployments:/app/deployments
    depends_on:
      hardhat-node:
        condition: service_healthy
    networks:
      - trust-hpc-net

  # client-admin:
  #   build:
  #     context: ../chain
  #     dockerfile: Dockerfile
  #   command: ["npx", "hardhat", "run", "scripts/simulate-admin.ts", "--network", "docker"]
  #   env_file:
  #     - .env
  #   volumes:
  #     - ../chain/deployments:/app/deployments
  #   depends_on:
  #     contract-deployer:
  #       condition: service_completed_successfully
  #   networks:
  #     - trust-hpc-net

  # client-owner:
  #   build:
  #     context: ../chain
  #     dockerfile: Dockerfile
  #   command: ["npx", "hardhat", "run", "scripts/simulate-owner.ts", "--network", "docker"]
  #   env_file:
  #     - .env
  #   volumes:
  #     - ../chain/deployments:/app/deployments
  #   depends_on:
  #     contract-deployer:
  #       condition: service_completed_successfully
  #   networks:
  #     - trust-hpc-net

  owner-auto-approver:
    build:
      context: ../chain
      dockerfile: Dockerfile
    command: ["npx", "hardhat", "run", "scripts/auto-approve-trusted.ts", "--network", "docker"]
    env_file:
      - .env
    environment:
      - TRUSTED_DEVICES_CONFIG=/app/config/trusted-devices.json
    volumes:
      - ../chain/deployments:/app/deployments
      - ../chain/config:/app/config:ro
    depends_on:
      contract-deployer:
        condition: service_completed_successfully
    networks:
      - trust-hpc-net

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../chain/deployments:/app/deployments
      - ../chain/artifacts:/app/artifacts
      - ../chain/config:/app/config
    env_file:
      - .env
    environment:
      - RPC_URL=http://hardhat-node:8545
      - DEPLOYMENTS_PATH=/app/deployments/localhost.json
      - ABI_PATH=/app/artifacts/contracts/OnboardingTrust.sol/OnboardingTrust.json
      - LEASING_ABI_PATH=/app/artifacts/contracts/LeasingRegistry.sol/LeasingRegistry.json
      - TRUSTED_DEVICES_CONFIG=/app/config/trusted-devices.json
    depends_on:
      auto-onboard:
        condition: service_completed_successfully
      contract-deployer:
        condition: service_completed_successfully
    networks:
      - trust-hpc-net
      - s4t-bridge

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - trust-hpc-net

  notification:
    build:
      context: ../notification
      dockerfile: Dockerfile
    volumes:
      - ../chain/deployments:/app/deployments
      - ../chain/artifacts:/app/artifacts
      - ../notification/state:/app/state
    env_file:
      - .env
    environment:
      - RPC_URL=http://hardhat-node:8545
      - DEPLOYMENTS_PATH=/app/deployments/localhost.json
      - ABI_PATH=/app/artifacts/contracts/OnboardingTrust.sol/OnboardingTrust.json
      - CHECKPOINT_FILE=/app/state/last_processed_block.txt
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      hardhat-node:
        condition: service_healthy
      contract-deployer:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks:
      - trust-hpc-net

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - trust-hpc-net

  auto-onboard:
    build:
      context: ../chain
      dockerfile: Dockerfile
    command: ["npx", "hardhat", "run", "scripts/auto-onboard-workers.ts", "--network", "docker"]
    env_file:
      - .env
    volumes:
      - ../chain/deployments:/app/deployments
      - ../chain/artifacts:/app/artifacts
    depends_on:
      hardhat-node:
        condition: service_healthy
      contract-deployer:
        condition: service_completed_successfully
    networks:
      - trust-hpc-net

networks:
  trust-hpc-net:
    driver: bridge
  s4t-bridge:
    external: true
